services:
  notification-demo-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: notification-demo-api:1.0.0
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DEMO_API_USERNAME: notification-user
      DEMO_API_PASSWORD: change-me-local-only
      NOTIFICATION_EMAIL_PROVIDER: SENDGRID
      NOTIFICATION_EMAIL_API_KEY: demo-sendgrid-api-key
      NOTIFICATION_EMAIL_SENDER: sender@example.com
      NOTIFICATION_SMS_ACCOUNT_SID: AC00000000000000000000000000000000
      NOTIFICATION_SMS_AUTH_TOKEN: demo-twilio-auth-token
      NOTIFICATION_SMS_FROM_NUMBER: +50370000000
      NOTIFICATION_PUSH_PROJECT_ID: notification-demo
      NOTIFICATION_PUSH_CREDENTIALS: demo-firebase-credentials
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
