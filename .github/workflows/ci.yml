name: CI

on:
  pull_request:
    branches:
      - develop
    types:
      - opened
      - synchronize
      - reopened

  push:
    branches:
      - develop
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-coverage:
    name: Build, tests and coverage
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: 1. Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: 3. Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 4. Dar permisos al Gradle Wrapper
        run: chmod +x gradlew

      - name: 5. Ejecutar pruebas y generar JaCoCo
        run: ./gradlew clean test --no-daemon --stacktrace

      - name: 6. Publicar reporte JaCoCo
        id: jacoco
        if: ${{ success() && github.event_name == 'pull_request' }}
        uses: madrapps/jacoco-report@v1.8.0
        with:
          paths: ${{ github.workspace }}/**/build/reports/jacoco/test/jacocoTestReport.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 80
          min-coverage-changed-lines: 80
          title: "📊 Reporte de Cobertura - Notifications Library"
          update-comment: true
          comment-type: both
          coverage-counter-type: LINE
          show-all-modules: true
          show-missing-lines: true

      - name: 7. Validar Quality Gate
        run: ./gradlew check --no-daemon --stacktrace